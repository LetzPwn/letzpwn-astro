name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Merge src/content submodule update
        if: steps.metadata.outputs.package-ecosystem == 'gitsubmodule'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merges made with GITHUB_TOKEN don't trigger push workflows, so start the deploy explicitly
      - name: Trigger deploy
        if: steps.metadata.outputs.package-ecosystem == 'gitsubmodule'
        run: gh workflow run astro.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
